<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pop It Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Fredoka',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1B1340;color:#FFFFFF;font-family:'Fredoka',system-ui,sans-serif;display:flex;flex-direction:column;padding:56px 24px 40px;overflow:hidden">
  <div style="display:flex;justify-content:flex-end">
    <button aria-label="Mute sound" style="width:48px;height:48px;border-radius:16px;border:0;background:#2A1F5E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px">
    <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:12px;padding:4px">
      <sc-for list="{{hero}}" as="b" hint-placeholder-count="15">
        <div style="aspect-ratio:1;border-radius:50%;background:{{b.bg}};box-shadow:inset 0 -4px 6px rgba(0,0,0,0.2);outline:{{b.ring}};outline-offset:3px"></div>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <h1 style="margin:0;font-size:76px;line-height:0.95;font-weight:700;letter-spacing:-1px">Pop It</h1>
      <p style="margin:0;font-size:19px;line-height:1.35;color:#B9B1E6">Pop only the ringed bubbles. Beat your best time.</p>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <a href="Levels.dc.html" style="display:flex;align-items:center;justify-content:center;height:60px;border-radius:30px;background:#FFD23F;color:#1B1340;font-size:22px;font-weight:600">Play levels</a>
    <a href="FreePop.dc.html" style="display:flex;align-items:center;justify-content:center;height:60px;box-sizing:border-box;border-radius:30px;border:2px solid #8B7FD8;color:#FFFFFF;font-size:22px;font-weight:600">Free pop</a>
    <p style="margin:6px 0 0;text-align:center;font-size:15px;color:#B9B1E6">Best on Level 1: 4.215s</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 15;
    const hero = [];
    for (let i = 0; i < n; i++) {
      hero.push({
        bg: 'radial-gradient(circle at 34% 28%, rgba(255,255,255,0.65), rgba(255,255,255,0) 52%), hsl(' + Math.round(i * 360 / n) + ' 82% 62%)',
        ring: (i === 3 || i === 11) ? '3px solid #FFFFFF' : 'none'
      });
    }
    return { hero: hero };
  }
}
</script>
</body>
</html>
