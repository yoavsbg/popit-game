<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pop It Free Pop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Fredoka',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#1B1340;color:#FFFFFF;font-family:'Fredoka',system-ui,sans-serif;display:flex;flex-direction:column;gap:16px;padding:56px 24px 28px;overflow:hidden">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="Main.dc.html" aria-label="Back to home" style="width:48px;height:48px;border-radius:16px;background:#2A1F5E;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 style="margin:0;font-size:24px;line-height:1.1;font-weight:600">Free pop</h1>
    <button aria-label="Mute sound" style="width:48px;height:48px;border-radius:16px;border:0;background:#2A1F5E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums">18</div>
      <div style="font-size:15px;color:#B9B1E6">popped. No timer, just pop.</div>
    </div>
    <button style="height:48px;padding:0 20px;border-radius:24px;border:2px solid #8B7FD8;background:transparent;color:#FFFFFF;font-family:'Fredoka',system-ui,sans-serif;font-size:18px;font-weight:600;box-sizing:border-box">Flip board</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:12px;padding:4px">
    <sc-for list="{{cells}}" as="b" hint-placeholder-count="35">
      <div style="aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:{{b.bg}};box-shadow:{{b.shadow}};transform:scale({{b.scale}})">
        <sc-if value="{{b.isStar}}" hint-placeholder-val="{{ false }}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="{{b.fg}}" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/></svg>
        </sc-if>
        <sc-if value="{{b.isHeart}}" hint-placeholder-val="{{ false }}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="{{b.fg}}" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </sc-if>
        <sc-if value="{{b.isDiamond}}" hint-placeholder-val="{{ false }}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="{{b.fg}}" aria-hidden="true"><path d="M12 2l9 10-9 10-9-10z"/></svg>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;gap:10px;margin-top:auto">
    <button style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;border:2px solid #FFFFFF;background:#2A1F5E;color:#FFFFFF;font-family:'Fredoka',system-ui,sans-serif;font-size:16px;font-weight:500;box-sizing:border-box">
      <span style="width:14px;height:14px;border-radius:50%;background:conic-gradient(#FF6B6B, #FFD23F, #5BE3A0, #5BB8FF, #B58CFF, #FF6B6B)"></span>
      Rainbow
    </button>
    <button style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;border:2px solid transparent;background:#2A1F5E;color:#FFFFFF;font-family:'Fredoka',system-ui,sans-serif;font-size:16px;font-weight:500;box-sizing:border-box">
      <span style="width:14px;height:14px;border-radius:50%;background:conic-gradient(#FF8FC8, #FFC2E2, #D9A3FF, #FFB3D1, #FF8FC8)"></span>
      Candy
    </button>
    <button style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;border:2px solid transparent;background:#2A1F5E;color:#FFFFFF;font-family:'Fredoka',system-ui,sans-serif;font-size:16px;font-weight:500;box-sizing:border-box">
      <span style="width:14px;height:14px;border-radius:50%;background:conic-gradient(#3DB8E8, #5BE3D8, #2E7FD9, #7FD3F0, #3DB8E8)"></span>
      Ocean
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 35;
    const popped = [1, 4, 7, 8, 10, 12, 16, 19, 21, 23, 25, 28, 30, 33];
    const cells = [];
    for (let i = 0; i < n; i++) {
      const k = popped.indexOf(i);
      const isPopped = k >= 0;
      const hue = Math.round(i * 360 / n);
      cells.push({
        bg: isPopped ? '#2A1F5E' : 'radial-gradient(circle at 34% 28%, rgba(255,255,255,0.65), rgba(255,255,255,0) 52%), hsl(' + hue + ' 82% 62%)',
        shadow: isPopped ? 'inset 0 4px 8px rgba(0,0,0,0.45)' : 'inset 0 -4px 6px rgba(0,0,0,0.2)',
        scale: isPopped ? '0.82' : '1',
        fg: 'hsl(' + hue + ' 85% 70%)',
        isStar: isPopped && k % 3 === 0,
        isHeart: isPopped && k % 3 === 1,
        isDiamond: isPopped && k % 3 === 2
      });
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
